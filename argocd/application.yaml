apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevm-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_GITHUB_USER/vcf9-vm-gitops-lab.git
    targetRevision: main
    path: vms
  destination:
    server: REPLACE_WITH_NAMESPACE_API_ENDPOINT
    namespace: kubevm-lab-hth89
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
