apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevm-lab
  namespace: kubevm-lab-hth89
spec:
  project: default
  source:
    repoURL: https://github.com/rutgerblom/vcf9-vm-gitops-lab.git
    targetRevision: main
    path: vms
  destination:
    server: https://kubernetes.default.svc/?context=kubevm-lab-hth89
    namespace: kubevm-lab-hth89
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
