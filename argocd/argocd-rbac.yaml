apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-manager-role
  namespace: kubevm-lab-hth89
rules:
  - apiGroups: ["vmoperator.vmware.com"]
    resources: ["virtualmachines", "virtualmachineservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-k8s-sa-binding
  namespace: kubevm-lab-hth89
subjects:
  - kind: ServiceAccount
    name: argocd-k8s-sa
    namespace: kubevm-lab-hth89
roleRef:
  kind: Role
  name: argocd-manager-role
  apiGroup: rbac.authorization.k8s.io
